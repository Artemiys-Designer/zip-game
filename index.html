const tr=k=>{if(LANG==='ru')return k;const a=TR[k];return a?a[LANG==='en'?0:LANG==='de'?1:2]:k;};
const f=(k,...a)=>tr(k).replace(/\{(\d)\}/g,(m,i)=>a[+i]);
function applyLang(){
  const fx=(o,ks)=>ks.forEach(k=>{if(o['_'+k]===undefined)o['_'+k]=o[k];o[k]=tr(o['_'+k]);});
  PLANETS.forEach(p=>{fx(p,['name']);p.arts.forEach(a=>fx(a,['n','c']));});
  MISSIONS.forEach(m=>fx(m,['t']));RELICS.forEach(r=>fx(r,['n','c']));OUT.forEach(o=>fx(o,['n']));ACH.forEach(a=>fx(a,['n','d']));
  try{document.title=tr('Зип: путь домой — cozy mystery');document.documentElement.lang=LANG;}catch(e){}
}
function nextLang(){LANG=LANGS[(LANGS.indexOf(LANG)+1)%LANGS.length];try{localStorage.setItem('zip-lang',LANG);}catch(e){}applyLang();}
let aQ=[],aToast=null;applyLang();
function checkAch(){
  let ch=false;
  for(const a of ACH){
    if(achU[a.id])continue;
    let ok=false;try{ok=a.t();}catch(e){}
    if(ok){achU[a.id]=true;ch=true;let x='';
      if(a.o!==undefined&&!ward.u.includes(a.o)){ward.u.push(a.o);saveWard();x=' · '+f('наряд «{0}»',OUT[a.o].n);}
      aQ.push({e:a.e,n:a.n,x});}
  }
  if(ch){saveMeta();checkAch();}
}
const fmtTime=t=>{const m=Math.floor(t/60),q=Math.floor(t%60);return m+':'+String(q).padStart(2,'0');};
const fmtDate=d=>{try{const x=new Date(d);return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0');}catch(e){return '';}};
let R={candy:0,star:0,bonus:0,hit:0,dj:0},jSel=null,statsT=0,chkT=0,tPlay=0,score0=0;
function missionDone(i){const m=MISSIONS[i];if(!m)return false;if(m.k==='candy')return R.candy>=m.n;if(m.k==='star')return R.star>=m.n;if(m.k==='bonus')return R.bonus>=m.n;if(m.k==='nohit')return R.hit===0;if(m.k==='nodj')return R.dj===0;return false;}
function missionProg(i){const m=MISSIONS[i];if(m.k==='candy')return R.candy+'/'+m.n;if(m.k==='star')return R.star+'/'+m.n;if(m.k==='bonus')return R.bonus+'/'+m.n;if(m.k==='nohit')return R.hit===0?'✓':'✗';return R.dj===0?'✓':'✗';}

function beep(f,d,type,v,slide){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.value=v||.06;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const sJump=()=>beep(380,.16,'square',.04,720);
const sPrize=()=>beep(880,.1,'triangle',.07,1320);
const sArt=()=>{beep(523,.18,'triangle',.08);setTimeout(()=>beep(659,.18,'triangle',.08),120);setTimeout(()=>beep(784,.3,'triangle',.08),240);};
const sHit=()=>beep(160,.3,'sawtooth',.07,60);
const sWin=()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.08),i*140));};

const sBonus=()=>{beep(700,.12,'triangle',.07,1100);setTimeout(()=>beep(1100,.18,'triangle',.07),90);};
let mus=null;
const SC=[[0,2,4,7,9],[0,3,5,7,10],[0,2,4,7,9],[0,2,3,7,8],[0,2,4,6,9],[0,2,3,5,7],[0,3,5,6,10],[0,1,4,7,8],[0,2,5,7,9]],RT=[262,196,247,220,294,175,233,185,175],TP=[230,270,250,210,240,300,260,200,290];
function stopMusic(){if(mus){clearInterval(mus.t);mus=null;}}
function startMusic(){
  stopMusic();if(!ac||!musicOn)return;
  mus={s:0};
  mus.t=setInterval(()=>{
    if(!ac||!musicOn||document.hidden)return;
    const sc=SC[pIdx]||SC[0],r=RT[pIdx]||262,st=mus.s++;
    const pat=[0,2,1,3,2,4,3,1],deg=sc[pat[st%8]];
    const oct=(Math.floor(st/8)%4===3)?2:1;
    const f=r*Math.pow(2,deg/12)*oct;
    if(st%2===0||Math.random()<.4)beep(f,.35,'triangle',.022);
    if(st%8===0)beep(r/2*Math.pow(2,sc[((st/8)|0)%3*2%sc.length]/12),1.2,'sine',.035);
    if(st%4===2)beep(f*2,.15,'sine',.012);
  },TP[pIdx]||250);
}
function toggleMusic(){musicOn=!musicOn;try{localStorage.setItem('zip-music',musicOn?'1':'0');}catch(e){}if(musicOn&&state!=='menu'&&state!=='win')startMusic();else stopMusic();}

// ---------- planet setup ----------
function startPlanet(i,retry){
  if(retry)score=score0;else score0=score;tPlay=0;
  pIdx=i;const pl=PLANETS[i];
  LEN=12500+i*1500;speed=(185+i*10)*(night?1.1:1);dist=0;
  objs={obs:[],prizes:[],arts:[],bon:[]};parts=[];toast=null;R={candy:0,star:0,bonus:0,hit:0,dj:0};
  P={y:GY,vy:0,jumps:0,duck:false,hearts:3,inv:0,run:0,onGround:true,mood:'',moodT:0,magnet:0,shield:false};
  const artX=[.2,.5,.78].map(f=>Math.round(LEN*f));
  const artY=[GY-60,GY-110,GY-130];
  pl.arts.forEach((a,k)=>{if(!got[i][k])objs.arts.push({k,x:artX[k],y:artY[k],got:false});});
  let x=900;
  const arc=(cx,span,hh,n)=>{for(let k=0;k<n;k++){const t=k/(n-1);objs.prizes.push({x:cx-span+t*span*2,y:GY-34-Math.sin(t*Math.PI)*hh,got:false,star:k===Math.floor(n/2)&&Math.random()<.3});}};
  while(x<LEN-500){
    if(artX.some(ax=>Math.abs(ax-x)<220)){x+=250;continue;}
    const r=Math.random();
    if(i>=1&&r<.18){
      objs.obs.push({x,w:54,h:30,y:GY-74,by:GY-74,air:true,bob:true});
      for(let k=0;k<4;k++)objs.prizes.push({x:x-30+k*30,y:GY-20,got:false,star:false});
    }else if(i>=2&&r<.28){
      objs.obs.push({x:x+200,w:34,h:34,y:GY-34,air:false,roll:true,vx:75+i*6});
    }else if(r<.42){
      const w=rand(72,92),h=rand(30,40);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,w/2+50,h+60,6);
    }else if(r<.56){
      const w=rand(28,36),h=rand(70,88);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,60,h+60,5);
    }else if(r<.72){
      const w1=rand(26,30),h1=rand(30,38),w2=rand(26,30),h2=rand(30,38),gap=rand(34,40);
      objs.obs.push({x,w:w1,h:h1,y:GY-h1,air:false});objs.obs.push({x:x+w1+gap,w:w2,h:h2,y:GY-h2,air:false});
      arc(x+(w1+gap+w2)/2,(w1+gap+w2)/2+40,Math.max(h1,h2)+65,7);x+=w1+gap+w2;
    }else{
      const w=rand(34,52),h=rand(34,58);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,70,h+55,5);
    }
    x+=rand(420,600)*(1-Math.min(i,8)*.025);
  }
  let bx=1400;
  while(bx<LEN-800){
    if(!artX.some(ax=>Math.abs(ax-bx)<160)&&!objs.obs.some(o=>Math.abs(o.x-bx)<90)){const q=Math.random();objs.bon.push({x:bx,y:GY-rand(55,100),t:q<.4?'magnet':q<.75?'shield':'heart',got:false});}
    bx+=rand(1800,2600);
  }
  startMusic();
  state='intro';introT=2.4;
}
function newGame(){got=PLANETS.map(()=>[false,false,false]);score=0;startPlanet(0);}
function continueGame(){got=saved.got.map(r=>r.slice());score=saved.score||0;startPlanet(Math.min(saved.p,PLANETS.length-1));}
function planetMissing(i){return got[i].filter(v=>!v).length;}
function totalGot(){return got.reduce((s,r)=>s+r.filter(Boolean).length,0);}

// ---------- input ----------
function doJump(){
  if(state!=='play')return;
  if(P.jumps<2){P.vy=P.jumps===0?-620:-560;P.jumps++;stats.jumps++;P.onGround=false;sJump();if(P.jumps===2){R.dj++;stats.dj++;burst(PX,P.y-4,'#9fe8ff',12);}}
}
function menuBtns(){return saved?[{x:240,y:268,w:320,h:50,a:'cont'},{x:240,y:330,w:320,h:50,a:'new'}]:[{x:240,y:285,w:320,h:58,a:'new'}];}
function onTap(x,y,id){
  if(x>W-56&&((state==='menu'&&y<56)||(state!=='menu'&&y>=50&&y<90))){toggleMusic();beep(520,.08,'triangle',.05);return;}
  if(state==='menu'){
    if(x>=16&&x<=166&&y>=12&&y<=46){state='journal';jSel=null;beep(600,.08,'triangle',.05);return;}
    if(x>=626&&x<=738&&y>=12&&y<=46){nextLang();beep(660,.08,'triangle',.05);return;}
    if(x>=172&&x<=322&&y>=12&&y<=46){state='ach';beep(600,.08,'triangle',.05);return;}
    if(x>=328&&x<=478&&y>=12&&y<=46){state='rec';beep(600,.08,'triangle',.05);return;}
    if(wonOnce&&x>=240&&x<=560&&y>=388&&y<=424){night=!night;try{localStorage.setItem('zip-night',night?'1':'0');}catch(e){}beep(night?330:520,.12,'triangle',.06);return;}
    if(x>=120&&x<=235&&y>=250){const u=ward.u;ward.sel=u[(u.indexOf(ward.sel)+1)%u.length];saveWard();beep(660,.1,'triangle',.06);return;}
    for(const b of menuBtns())if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(b.a==='cont')continueGame();else{clearSave();newGame();}return;}
  }else if(state==='intro'){introT=0;}
  else if(state==='play'){if(x<W*.6)doJump();else{touchDuck=true;duckPtr=id;}}
  else if(state==='end'){
    if(endInfo.ok){if(pIdx+1>=PLANETS.length){state='win';clearSave();sWin();stopMusic();wonOnce=true;try{localStorage.setItem('zip-won','1');}catch(e){}stats.wins++;rec.runs.push({s:score,d:Date.now(),n:night?1:0});rec.runs.sort((a,b)=>b.s-a.s);rec.runs=rec.runs.slice(0,10);saveMeta();checkAch();}else{pIdx++;score0=score;save();startPlanet(pIdx);}}
    else startPlanet(pIdx,true);
  }else if(state==='dead'){startPlanet(pIdx,true);}
  else if(state==='win'){state='menu';loadSave();stopMusic();}
  else if(state==='ach'||state==='rec'){if(x<150&&y<56)state='menu';}
  else if(state==='journal'){
    if(x<150&&y<56){state='menu';return;}
    for(let r=0;r<PLANETS.length;r++)for(let k=0;k<4;k++){if(Math.hypot(x-(250+k*64),y-(84+r*35))<22){jSel={r,k};return;}}
  }
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const r=cv.getBoundingClientRect();onTap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H,e.pointerId);});
const upH=e=>{if(duckPtr===e.pointerId){touchDuck=false;duckPtr=null;}};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);cv.addEventListener('pointerleave',upH);
addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='KeyM'&&!e.repeat){toggleMusic();return;}
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(e.repeat)return;
    if(state==='play')doJump();
    else if(state==='menu'){saved?continueGame():(clearSave(),newGame());}
    else onTap(W/2,H/2,0);}
  if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();keyDuck=true;}
});
addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))keyDuck=false;});

// ---------- update ----------
function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-120,120),vy:rand(-180,40),l:rand(.4,.8),c:col});}
function update(dt){
  time+=dt;
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt;});parts=parts.filter(p=>p.l>0);
  if(toast){toast.t-=dt;if(toast.t<=0)toast=null;}
  if(aToast){aToast.t-=dt;if(aToast.t<=0)aToast=null;}
  if(!aToast&&aQ.length){aToast=aQ.shift();aToast.t=3.6;sArt();}
  chkT+=dt;if(chkT>.5){chkT=0;checkAch();}
  statsT+=dt;if(statsT>6){statsT=0;saveMeta();}
  if(state==='intro'){introT-=dt;if(introT<=0)state='play';return;}
  if(state!=='play')return;
  dist+=speed*dt;tPlay+=dt;
  for(const o of objs.obs){if(o.vx)o.x-=o.vx*dt;if(o.bob)o.y=o.by+Math.sin(time*3+o.x*.01)*8;}
  P.run+=dt*speed/38;
  if(P.inv>0)P.inv-=dt;if(P.moodT>0)P.moodT-=dt;
  const wantDuck=keyDuck||touchDuck;
  P.duck=wantDuck&&P.onGround;
  P.vy+=1400*dt;P.y+=P.vy*dt;
  if(P.y>=GY){P.y=GY;P.vy=0;P.onGround=true;P.jumps=0;}
  const bh=P.duck?28:52;
  const hb={x:PX-13,y:P.y-bh+4,w:26,h:bh-6};
  for(const o of objs.obs){
    const sx=o.x-dist;if(sx>PX+80||sx<-120)continue;
    if(P.inv>0)continue;
    if(hb.x<sx+o.w-4&&hb.x+hb.w>sx+4&&hb.y<o.y+o.h-3&&hb.y+hb.h>o.y+3){
      if(P.shield){P.shield=false;stats.shield++;P.inv=1;beep(300,.25,'triangle',.07,900);burst(PX,P.y-24,'#9fe8ff',20);continue;}
      P.hearts--;R.hit++;P.inv=1.5;sHit();P.mood='ouch';P.moodT=1.2;burst(PX,P.y-24,'#ff6b8a',14);
      if(P.hearts<=0){state='dead';return;}
    }
  }
  const cx=PX,cy=P.y-bh/2;
  if(P.magnet>0){P.magnet-=dt;for(const p of objs.prizes){if(p.got)continue;const sx=p.x-dist;if(Math.abs(sx-cx)<230&&Math.abs(p.y-cy)<230){const k=Math.min(1,dt*7);p.x+=(cx+dist-p.x)*k;p.y+=(cy-p.y)*k;}}}
  for(const b of objs.bon){
    if(b.got)continue;const sx=b.x-dist;if(sx<-50||sx>W+50)continue;
    if(Math.hypot(sx-cx,b.y-cy)<36){b.got=true;R.bonus++;stats.bonus++;sBonus();burst(sx,b.y,'#9fe8ff',16);P.mood='happy';P.moodT=.8;
      if(b.t==='magnet')P.magnet=9;else if(b.t==='shield')P.shield=true;else P.hearts=Math.min(5,P.hearts+1);}
  }
  for(const p of objs.prizes){
    if(p.got)continue;const sx=p.x-dist;if(sx<-40||sx>W+40)continue;
    if(Math.hypot(sx-cx,p.y-cy)<30){p.got=true;R.candy++;stats.candy++;if(p.star){R.star++;stats.star++;}score+=p.star?50:10;sPrize();burst(sx,p.y,p.star?'#fff27a':'#ffd24a',6);if(P.moodT<.4){P.mood='happy';P.moodT=.5;}}
  }
  for(const a of objs.arts){
    if(a.got)continue;const sx=a.x-dist;if(sx<-60||sx>W+60)continue;
    if(Math.hypot(sx-cx,a.y-cy)<42){
      a.got=true;got[pIdx][a.k]=true;book.a[pIdx][a.k]=true;saveBook();save();sArt();P.mood='happy';P.moodT=1.4;burst(sx,a.y,'#ffe66b',26);
      const d=PLANETS[pIdx].arts[a.k];toast={t:3.6,e:d.e,n:d.n,c:d.c};
    }
  }
  if(dist+PX>=LEN){
    const miss=planetMissing(pIdx);
    const md=missionDone(pIdx);
    endInfo={ok:miss===0,miss,md,relicNew:false};state='end';
    if(md&&!book.r[pIdx]){book.r[pIdx]=true;saveBook();endInfo.relicNew=true;}
    if(miss===0){sWin();const o=OUTMAP[pIdx];if(o!==undefined&&!ward.u.includes(o)){ward.u.push(o);ward.sel=o;saveWard();endInfo.newOutfit=OUT[o].n;}
      stats.planets++;if(R.hit===0)stats.clean=true;if(night)stats.night=true;
      const bonus=200+100*P.hearts+(md?300:0);score+=bonus;endInfo.bonus=bonus;
      const ps=score-score0;if(ps>rec.bs[pIdx])rec.bs[pIdx]=ps;
      const tm=Math.round(tPlay*10)/10;if(!rec.bt[pIdx]||tm<rec.bt[pIdx])rec.bt[pIdx]=tm;
      save();}
    saveMeta();checkAch();
  }
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,col,al,wt){ctx.font=(wt||'bold')+' '+size+'px system-ui,-apple-system,Segoe UI,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function panel(x,y,w,h,r,col){ctx.fillStyle=col||'rgba(20,10,45,.78)';rr(x,y,w,h,r);ctx.fill();}
function hills(col,base,amp,wl,f){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,base+Math.sin((x+dist*f)/wl)*amp+Math.sin((x+dist*f)/(wl*.37))*amp*.35);ctx.lineTo(W,H);ctx.closePath();ctx.fill();}

const hash=n=>{const q=Math.sin(n*127.1+311.7)*43758.5453;return q-Math.floor(q);};
const mod=(v,m)=>((v%m)+m)%m;
function hx(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function lerpC(a,b,t){const A=hx(a),B=hx(b);return 'rgb('+A.map((v,k)=>Math.round(v+(B[k]-v)*t)).join(',')+')';}
function layer(sp,par,fn){const sc=dist*par;const a=Math.floor(sc/sp)-2;const n=Math.ceil(W/sp)+5;for(let k=a;k<a+n;k++){const h=hash(k*7.13+pIdx*3.1);fn(k*sp+(h-.5)*sp*.6-sc,h,k);}}
function drawBG(pl){

  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,lerpC(pl.sky[0],pl.sky2[0],prog));g.addColorStop(1,lerpC(pl.sky[1],pl.sky2[1],prog));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=(.15+.65*prog)*(.5+.5*Math.sin(time*2+s.t));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;

  ctx.fillStyle=pl.moon;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(mx,my,38,0,7);ctx.fill();
  ctx.globalAlpha=.2;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(mx-12,my-10,11,0,7);ctx.arc(mx+14,my+12,8,0,7);ctx.arc(mx+8,my-16,5,0,7);ctx.fill();ctx.globalAlpha=1;
  if(pIdx===3){ // far ringed planet
    ctx.fillStyle='rgba(200,230,255,.85)';ctx.beginPath();ctx.arc(170,120,26,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(170,120,46,10,-.35,0,7);ctx.stroke();
  }
  if(pIdx===8||pIdx===1){ // aurora
    ctx.lineWidth=20;
    for(let k=0;k<3;k++){ctx.globalAlpha=.1+.04*k;ctx.strokeStyle=['#5bffb0','#8f7bff','#5bd7ff'][k];ctx.beginPath();for(let x=0;x<=W;x+=20){const y=70+k*30+Math.sin(x/110+time*.5+k*2)*20;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
    ctx.globalAlpha=1;
  }
  layer(520,.1,(x,h)=>{
    if(h<.35)return;const y=45+h*110,a=Math.sin(time*6+h*9)*4;
    if(pIdx===0||pIdx===2){ctx.strokeStyle=pIdx?'#fff':'#7a3a8a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y+a);ctx.quadraticCurveTo(x-4,y-3,x,y);ctx.quadraticCurveTo(x+4,y-3,x+9,y+a);ctx.stroke();ctx.beginPath();ctx.moveTo(x+30,y+14+a);ctx.quadraticCurveTo(x+34,y+11,x+38,y+14);ctx.quadraticCurveTo(x+42,y+11,x+46,y+14+a);ctx.stroke();}
    else if(pIdx===1){ctx.fillStyle='#0b1f26';ctx.beginPath();ctx.ellipse(x,y,4,5,0,0,7);ctx.fill();ctx.strokeStyle='#0b1f26';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-12,y+a);ctx.quadraticCurveTo(x-5,y-6,x,y);ctx.quadraticCurveTo(x+5,y-6,x+12,y+a);ctx.stroke();}
    else if(pIdx===3){const by=y+Math.sin(time*.8+h*5)*6;ctx.fillStyle='#ff8f6b';ctx.beginPath();ctx.arc(x,by,20,0,7);ctx.fill();ctx.fillStyle='#ffd15c';ctx.beginPath();ctx.ellipse(x,by,7,20,0,0,7);ctx.fill();ctx.fillStyle='#8a5a2b';ctx.fillRect(x-6,by+26,12,8);ctx.strokeStyle='#8a5a2b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-12,by+16);ctx.lineTo(x-5,by+26);ctx.moveTo(x+12,by+16);ctx.lineTo(x+5,by+26);ctx.stroke();}
    else if(pIdx===4){const ky=y+Math.sin(time*1.2+h*5)*8;ctx.fillStyle='#ff9f4a';ctx.beginPath();ctx.moveTo(x,ky-14);ctx.lineTo(x+10,ky);ctx.lineTo(x,ky+14);ctx.lineTo(x-10,ky);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffe66b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,ky+14);ctx.bezierCurveTo(x-10,ky+26,x+10,ky+34,x-4,ky+48);ctx.stroke();}

    if(endInfo.ok)overlay(tr('Планета пройдена! ✨'),[tr('Все артефакты здесь собраны.'),endInfo.newOutfit?f('Новый наряд для Зипа: «{0}»! 🎉',endInfo.newOutfit):tr('Портал открывается — летим дальше.'),mLine,f('Бонус +{0} · Счёт: {1}',endInfo.bonus,score)],pIdx+1>=PLANETS.length?tr('Нажми — лететь домой!'):tr('Нажми — следующая планета'),'#ffe66b');
    else overlay(tr('Портал закрыт'),[f('Не хватает артефактов: {0}.',endInfo.miss),tr('Они всё ещё лежат на планете — вернись и найди.'),mLine],tr('Нажми, чтобы попробовать снова'),'#ff9aa8');
  }
}

let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;
  update(dt);draw();drawAToast();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
