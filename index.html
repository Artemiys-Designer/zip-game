function startMusic(){
  stopMusic();if(!ac||!musicOn)return;
  mus={s:0,k:musKind()};
  mus.t=setInterval(()=>{
    if(!ac||!musicOn||document.hidden)return;
    const menuK=mus.k==='menu',vm=menuK?.45:1,p=menuK?8:(pIdx||0),sc=SC[p]||SC[0],r=RT[p]||262,st=mus.s++,bar=(st>>4)&1,k=st%16;
    const note=i=>r*Math.pow(2,(sc[i%5]+12*Math.floor(i/5))/12);
    let n=MEL[p][k];
    if(n>=0){if(bar)n=(n+2)%10;beep(note(n),p===2?.6:.32,LEAD[p]||'triangle',(p===6?.014:.026)*vm,0,'m');}
    if(k%4===0)beep(note([0,0,2,1][k>>2])/2,.9,'sine',.04*vm,0,'m');
    if(k===0)beep(note(2)/2,2.4,'sine',.018*vm,0,'m');
    if(k%8===6&&n>=0)beep(note(n)*2,.12,'sine',.01*vm,0,'m');
  },TP[mus.k==='menu'?8:pIdx]||250);
}

function startPlanet(i,retry){
  if(retry)score=score0;else score0=score;tPlay=0;
  const _mr=Math.random;
  if(daily){let a=dailySeed>>>0;Math.random=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
  pIdx=i;const pl=PLANETS[i];
  LEN=15000+i*1800;speed=(185+i*10)*(night?1.1:1)*DIFFS[diff].sp;dist=0;
  objs={obs:[],prizes:[],arts:[],bon:[]};parts=[];pops=[];combo=0;resetPet();toast=null;R={candy:0,star:0,bonus:0,hit:0,dj:0};
  P={y:GY,vy:0,jumps:0,duck:false,hearts:DIFFS[diff].h,inv:0,run:0,onGround:true,mood:'',moodT:0,magnet:0,shield:false};

  const artY=[GY-60,GY-110,GY-130];
  if(!daily)pl.arts.forEach((a,k)=>{if(!got[i][k])objs.arts.push({k,x:artX[k],y:artY[k],got:false});});
  let x=900;
  const arc=(cx,span,hh,n)=>{for(let k=0;k<n;k++){const t=k/(n-1);objs.prizes.push({x:cx-span+t*span*2,y:GY-34-Math.sin(t*Math.PI)*hh,got:false,star:k===Math.floor(n/2)&&Math.random()<.3});}};
  while(x<LEN-500){
    if(artX.some(ax=>Math.abs(ax-x)<220)){x+=250;continue;}
    const r=Math.random();
    if(i>=1&&r<.18){
      objs.obs.push({x,w:54,h:30,y:GY-74,by:GY-74,air:true,bob:true});
      for(let k=0;k<4;k++)objs.prizes.push({x:x-30+k*30,y:GY-20,got:false,star:false});
    }else if(i>=2&&r<.28&&DIFFS[diff].roll){
      objs.obs.push({x:x+200,w:34,h:34,y:GY-34,air:false,roll:true,vx:75+i*6});
    }else if(r<.42){
      const w=rand(72,92),h=rand(30,40);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,w/2+50,h+60,6);
    }else if(r<.56){
      const w=rand(28,36),h=rand(70,88);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,60,h+60,5);
    }else if(r<.72){
      const w1=rand(26,30),h1=rand(30,38),w2=rand(26,30),h2=rand(30,38),gap=rand(34,40);
      objs.obs.push({x,w:w1,h:h1,y:GY-h1,air:false});objs.obs.push({x:x+w1+gap,w:w2,h:h2,y:GY-h2,air:false});
      arc(x+(w1+gap+w2)/2,(w1+gap+w2)/2+40,Math.max(h1,h2)+65,7);x+=w1+gap+w2;
    }else{
      const w=rand(34,52),h=rand(34,58);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,70,h+55,5);
    }
    x+=rand(420,600)*(1-Math.min(i,8)*.025)*DIFFS[diff].gap;
  }
  let bx=1400;
  while(bx<LEN-800){
    if(!artX.some(ax=>Math.abs(ax-bx)<160)&&!objs.obs.some(o=>Math.abs(o.x-bx)<90)){const q=Math.random();objs.bon.push({x:bx,y:GY-rand(55,100),t:q<.4?'magnet':q<.75?'shield':'heart',got:false});}
    bx+=rand(1800,2600);
  }
  Math.random=_mr;
  state='intro';introT=2.4;

let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;
  update(dt);draw();drawAToast();
  if(ac&&musicOn){const mk=musKind();if(!mus&&mk==='menu')startMusic();else if(mus&&mus.k==='menu'&&mk!=='menu')stopMusic();}
  requestAnimationFrame(frame);
}
