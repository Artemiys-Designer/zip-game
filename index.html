<html lang="ru">
<head>
<meta charset="utf-8">

<style>

<body>
<div id="rot">📱↻<br><br>Поверните телефон горизонтально</div>
<canvas id="c" width="800" height="450"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=450,GY=370,PX=150;
const PLANETS=[
 {name:'Мармеладия',sky:['#ff9ad5','#ffd6a5'],sky2:['#5a3fa8','#ff9a8b'],hill1:'#e86bb0',hill2:'#c9529a',ground:'#9b3f86',top:'#ff8fd0',moon:'#fff3b0',obs:'jelly',
  arts:[{e:'🔧',n:'Гаечный ключ',c:'На рукоятке следы шоколада…'},{e:'🧭',n:'Звёздный компас',c:'Стрелка дрожит: кто-то был совсем рядом.'},{e:'🍪',n:'Печенье',c:'Крошки ведут к Грибному лугу.'}]},
 {name:'Грибной луг',sky:['#1b2a5c','#2f7a7a'],sky2:['#070c24','#144a50'],hill1:'#1f5f63',hill2:'#174a52',ground:'#0f3a40',top:'#3fbf9f',moon:'#d8f3ff',obs:'mushroom',
  arts:[{e:'🍄',n:'Золотой гриб',c:'Его аккуратно срезали, а не сорвали.'},{e:'🔦',n:'Фонарик',c:'Батарейки ещё тёплые. Вор был здесь.'},{e:'📜',n:'Записка',c:'«Не ищи меня до рассвета». Почерк круглый.'}]},
 {name:'Ледяной пудинг',sky:['#7ec8ff','#e8f6ff'],sky2:['#3a5aa8','#ffc9e0'],hill1:'#a9d8f5',hill2:'#8cc4e8',ground:'#6fa8d0',top:'#e8f8ff',moon:'#ffffff',obs:'ice',
  arts:[{e:'❄️',n:'Ключ-снежинка',c:'Тает в руке, но замок помнит узор.'},{e:'🧣',n:'Вязаный шарф',c:'Пахнет лавандой. Кто носит такие?'},{e:'🥄',n:'Ложка от пудинга',c:'Пудинг не тронут. Вор не любит сладкое?'}]},
 {name:'Лавандовая пустошь',sky:['#ff9966','#ffcf9f'],sky2:['#2a1450','#e0507a'],hill1:'#c68bd6',hill2:'#a96fc0',ground:'#7b4a96',top:'#d9a6ee',moon:'#fff0c8',obs:'cactus',
  arts:[{e:'🔭',n:'Подзорная труба',c:'Направлена прямо на Кристальную луну.'},{e:'🪶',n:'Большое перо',c:'Слишком большое для обычной птицы.'},{e:'🗝️',n:'Ржавый ключик',c:'Подходит к бортовому замку корабля!'}]},
 {name:'Кристальная луна',sky:['#0a0620','#3a1f7a'],sky2:['#02010f','#1a3a8f'],hill1:'#4b2a8f',hill2:'#3a2073',ground:'#25134f',top:'#8a6bff',moon:'#e6e0ff',obs:'crystal',
  arts:[{e:'💎',n:'Лунный кристалл',c:'Внутри мерцает чей-то силуэт с ушками.'},{e:'🦉',n:'Статуэтка совы',c:'Сова-хранительница! Так вот кто вор…'},{e:'🚀',n:'Звёздный ключ',c:'Он здесь! Корабль снова может лететь.'}]}
];
const TOTAL=PLANETS.length*3;
const rand=(a,b)=>a+Math.random()*(b-a);
let state='menu',pIdx=0,dist=0,speed=280,LEN=9000,time=0,score=0;
let got=PLANETS.map(()=>[false,false,false]);
let objs={obs:[],prizes:[],arts:[]};
let P={y:GY,vy:0,jumps:0,duck:false,hearts:3,inv:0,run:0,onGround:true,mood:'',moodT:0},toast=null,parts=[],stars=[],introT=0,endInfo=null,saved=null;
let keyDuck=false,touchDuck=false,duckPtr=null,pendingJump=false;
for(let i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*260,r:Math.random()*1.5+.4,t:Math.random()*6});

// ---------- save ----------
function loadSave(){try{const s=JSON.parse(localStorage.getItem('zip-mystery')||'null');if(s&&Array.isArray(s.got)&&s.got.length===PLANETS.length)saved=s;}catch(e){}}
function save(){try{localStorage.setItem('zip-mystery',JSON.stringify({p:pIdx,got}));}catch(e){}}
function clearSave(){saved=null;try{localStorage.removeItem('zip-mystery');}catch(e){}}
loadSave();
const OUT=[{n:'Сыщик',sc:'#e8556b'},{n:'Кондитер',sc:'#ff8fc7'},{n:'Грибник',sc:'#7bd45a'},{n:'Полярник',sc:'#ffffff'},{n:'Путник',sc:'#ff9a3c'},{n:'Звездочёт',sc:'#ffd24a'}];
let ward={u:[0],sel:0};
function loadWard(){try{const w=JSON.parse(localStorage.getItem('zip-ward')||'null');if(w&&Array.isArray(w.u)){ward.u=w.u.filter(n=>Number.isInteger(n)&&n>=0&&n<OUT.length);if(!ward.u.includes(0))ward.u.unshift(0);ward.sel=ward.u.includes(w.sel)?w.sel:0;}}catch(e){}}
function saveWard(){try{localStorage.setItem('zip-ward',JSON.stringify(ward));}catch(e){}}
loadWard();
let musicOn=true,night=false,wonOnce=false;
try{musicOn=localStorage.getItem('zip-music')!=='0';night=localStorage.getItem('zip-night')==='1';wonOnce=localStorage.getItem('zip-won')==='1';}catch(e){}
if(!wonOnce)night=false;

// ---------- audio ----------
let ac=null;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
function beep(f,d,type,v,slide){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.value=v||.06;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const sJump=()=>beep(380,.16,'square',.04,720);
const sPrize=()=>beep(880,.1,'triangle',.07,1320);
const sArt=()=>{beep(523,.18,'triangle',.08);setTimeout(()=>beep(659,.18,'triangle',.08),120);setTimeout(()=>beep(784,.3,'triangle',.08),240);};
const sHit=()=>beep(160,.3,'sawtooth',.07,60);
const sWin=()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.08),i*140));};

const sBonus=()=>{beep(700,.12,'triangle',.07,1100);setTimeout(()=>beep(1100,.18,'triangle',.07),90);};
let mus=null;
const SC=[[0,2,4,7,9],[0,3,5,7,10],[0,2,4,7,9],[0,2,3,7,8],[0,2,5,7,9]],RT=[262,196,247,220,175],TP=[230,270,250,210,290];
function stopMusic(){if(mus){clearInterval(mus.t);mus=null;}}
function startMusic(){
  stopMusic();if(!ac||!musicOn)return;
  mus={s:0};
  mus.t=setInterval(()=>{
    if(!ac||!musicOn||document.hidden)return;
    const sc=SC[pIdx]||SC[0],r=RT[pIdx]||262,st=mus.s++;
    const pat=[0,2,1,3,2,4,3,1],deg=sc[pat[st%8]];
    const oct=(Math.floor(st/8)%4===3)?2:1;
    const f=r*Math.pow(2,deg/12)*oct;
    if(st%2===0||Math.random()<.4)beep(f,.35,'triangle',.022);
    if(st%8===0)beep(r/2*Math.pow(2,sc[((st/8)|0)%3*2%sc.length]/12),1.2,'sine',.035);
    if(st%4===2)beep(f*2,.15,'sine',.012);
  },TP[pIdx]||250);
}
function toggleMusic(){musicOn=!musicOn;try{localStorage.setItem('zip-music',musicOn?'1':'0');}catch(e){}if(musicOn&&state!=='menu'&&state!=='win')startMusic();else stopMusic();}

// ---------- planet setup ----------
function startPlanet(i){
  pIdx=i;const pl=PLANETS[i];
  LEN=16000+i*2600;speed=(260+i*22)*(night?1.15:1);dist=0;
  objs={obs:[],prizes:[],arts:[],bon:[]};parts=[];toast=null;
  P={y:GY,vy:0,jumps:0,duck:false,hearts:3,inv:0,run:0,onGround:true,mood:'',moodT:0,magnet:0,shield:false};
  const artX=[.2,.5,.78].map(f=>Math.round(LEN*f));
  const artY=[GY-60,GY-110,GY-130];
  pl.arts.forEach((a,k)=>{if(!got[i][k])objs.arts.push({k,x:artX[k],y:artY[k],got:false});});
  let x=900;
  const arc=(cx,span,hh,n)=>{for(let k=0;k<n;k++){const t=k/(n-1);objs.prizes.push({x:cx-span+t*span*2,y:GY-34-Math.sin(t*Math.PI)*hh,got:false,star:k===Math.floor(n/2)&&Math.random()<.3});}};
  while(x<LEN-500){
    if(artX.some(ax=>Math.abs(ax-x)<220)){x+=250;continue;}
    const r=Math.random();
    if(i>=1&&r<.18){
      objs.obs.push({x,w:54,h:30,y:GY-74,by:GY-74,air:true,bob:true});
      for(let k=0;k<4;k++)objs.prizes.push({x:x-30+k*30,y:GY-20,got:false,star:false});
    }else if(i>=2&&r<.28){
      objs.obs.push({x:x+200,w:34,h:34,y:GY-34,air:false,roll:true,vx:110+i*10});
    }else if(r<.42){
      const w=rand(90,120),h=rand(30,40);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,w/2+50,h+60,6);
    }else if(r<.56){
      const w=rand(28,36),h=rand(70,88);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,60,h+60,5);
    }else if(r<.72){
      const w1=rand(28,34),h1=rand(30,40),w2=rand(28,34),h2=rand(30,40),gap=rand(45,56);
      objs.obs.push({x,w:w1,h:h1,y:GY-h1,air:false});objs.obs.push({x:x+w1+gap,w:w2,h:h2,y:GY-h2,air:false});
      arc(x+(w1+gap+w2)/2,(w1+gap+w2)/2+40,Math.max(h1,h2)+65,7);x+=w1+gap+w2;
    }else{
      const w=rand(34,52),h=rand(34,58);objs.obs.push({x,w,h,y:GY-h,air:false});arc(x+w/2,70,h+55,5);
    }
    x+=rand(420,600)*(1-i*.03);
  }
  let bx=1400;
  while(bx<LEN-800){
    if(!artX.some(ax=>Math.abs(ax-bx)<160)&&!objs.obs.some(o=>Math.abs(o.x-bx)<90)){const q=Math.random();objs.bon.push({x:bx,y:GY-rand(55,100),t:q<.4?'magnet':q<.75?'shield':'heart',got:false});}
    bx+=rand(1800,2600);
  }
  startMusic();
  state='intro';introT=2.4;
}
function newGame(){got=PLANETS.map(()=>[false,false,false]);score=0;startPlanet(0);}
function continueGame(){got=saved.got.map(r=>r.slice());startPlanet(Math.min(saved.p,PLANETS.length-1));}
function planetMissing(i){return got[i].filter(v=>!v).length;}
function totalGot(){return got.reduce((s,r)=>s+r.filter(Boolean).length,0);}

// ---------- input ----------
function doJump(){
  if(state!=='play')return;
  if(P.jumps<2){P.vy=P.jumps===0?-700:-620;P.jumps++;P.onGround=false;sJump();if(P.jumps===2)burst(PX,P.y-4,'#9fe8ff',12);}
}
function menuBtns(){return saved?[{x:240,y:268,w:320,h:50,a:'cont'},{x:240,y:330,w:320,h:50,a:'new'}]:[{x:240,y:285,w:320,h:58,a:'new'}];}
function onTap(x,y,id){
  if(x>W-56&&((state==='menu'&&y<56)||(state!=='menu'&&y>=50&&y<90))){toggleMusic();beep(520,.08,'triangle',.05);return;}
  if(state==='menu'){
    if(wonOnce&&x>=240&&x<=560&&y>=388&&y<=424){night=!night;try{localStorage.setItem('zip-night',night?'1':'0');}catch(e){}beep(night?330:520,.12,'triangle',.06);return;}
    if(x>=120&&x<=235&&y>=250){const u=ward.u;ward.sel=u[(u.indexOf(ward.sel)+1)%u.length];saveWard();beep(660,.1,'triangle',.06);return;}
    for(const b of menuBtns())if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(b.a==='cont')continueGame();else{clearSave();newGame();}return;}
  }else if(state==='intro'){introT=0;}
  else if(state==='play'){if(x<W*.6)doJump();else{touchDuck=true;duckPtr=id;}}
  else if(state==='end'){
    if(endInfo.ok){if(pIdx+1>=PLANETS.length){state='win';clearSave();sWin();stopMusic();wonOnce=true;try{localStorage.setItem('zip-won','1');}catch(e){}}else{pIdx++;save();startPlanet(pIdx);}}
    else startPlanet(pIdx);
  }else if(state==='dead'){startPlanet(pIdx);}
  else if(state==='win'){state='menu';loadSave();stopMusic();}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const r=cv.getBoundingClientRect();onTap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H,e.pointerId);});
const upH=e=>{if(duckPtr===e.pointerId){touchDuck=false;duckPtr=null;}};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);cv.addEventListener('pointerleave',upH);
addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='KeyM'&&!e.repeat){toggleMusic();return;}
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(e.repeat)return;
    if(state==='play')doJump();
    else if(state==='menu'){saved?continueGame():(clearSave(),newGame());}
    else onTap(W/2,H/2,0);}
  if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();keyDuck=true;}
});
addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))keyDuck=false;});

// ---------- update ----------
function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-120,120),vy:rand(-180,40),l:rand(.4,.8),c:col});}
function update(dt){
  time+=dt;
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt;});parts=parts.filter(p=>p.l>0);
  if(toast){toast.t-=dt;if(toast.t<=0)toast=null;}
  if(state==='intro'){introT-=dt;if(introT<=0)state='play';return;}
  if(state!=='play')return;
  dist+=speed*dt;
  for(const o of objs.obs){if(o.vx)o.x-=o.vx*dt;if(o.bob)o.y=o.by+Math.sin(time*3+o.x*.01)*8;}
  P.run+=dt*speed/38;
  if(P.inv>0)P.inv-=dt;if(P.moodT>0)P.moodT-=dt;
  const wantDuck=keyDuck||touchDuck;
  P.duck=wantDuck&&P.onGround;
  P.vy+=1900*dt;P.y+=P.vy*dt;
  if(P.y>=GY){P.y=GY;P.vy=0;P.onGround=true;P.jumps=0;}
  const bh=P.duck?28:52;
  const hb={x:PX-13,y:P.y-bh+4,w:26,h:bh-6};
  for(const o of objs.obs){
    const sx=o.x-dist;if(sx>PX+80||sx<-120)continue;
    if(P.inv>0)continue;
    if(hb.x<sx+o.w-4&&hb.x+hb.w>sx+4&&hb.y<o.y+o.h-3&&hb.y+hb.h>o.y+3){
      if(P.shield){P.shield=false;P.inv=1;beep(300,.25,'triangle',.07,900);burst(PX,P.y-24,'#9fe8ff',20);continue;}
      P.hearts--;P.inv=1.5;sHit();P.mood='ouch';P.moodT=1.2;burst(PX,P.y-24,'#ff6b8a',14);
      if(P.hearts<=0){state='dead';return;}
    }
  }
  const cx=PX,cy=P.y-bh/2;
  if(P.magnet>0){P.magnet-=dt;for(const p of objs.prizes){if(p.got)continue;const sx=p.x-dist;if(Math.abs(sx-cx)<230&&Math.abs(p.y-cy)<230){const k=Math.min(1,dt*7);p.x+=(cx+dist-p.x)*k;p.y+=(cy-p.y)*k;}}}
  for(const b of objs.bon){
    if(b.got)continue;const sx=b.x-dist;if(sx<-50||sx>W+50)continue;
    if(Math.hypot(sx-cx,b.y-cy)<36){b.got=true;sBonus();burst(sx,b.y,'#9fe8ff',16);P.mood='happy';P.moodT=.8;
      if(b.t==='magnet')P.magnet=9;else if(b.t==='shield')P.shield=true;else P.hearts=Math.min(5,P.hearts+1);}
  }
  for(const p of objs.prizes){
    if(p.got)continue;const sx=p.x-dist;if(sx<-40||sx>W+40)continue;
    if(Math.hypot(sx-cx,p.y-cy)<30){p.got=true;score+=p.star?50:10;sPrize();burst(sx,p.y,p.star?'#fff27a':'#ff9ad5',6);if(P.moodT<.4){P.mood='happy';P.moodT=.5;}}
  }
  for(const a of objs.arts){
    if(a.got)continue;const sx=a.x-dist;if(sx<-60||sx>W+60)continue;
    if(Math.hypot(sx-cx,a.y-cy)<42){
      a.got=true;got[pIdx][a.k]=true;save();sArt();P.mood='happy';P.moodT=1.4;burst(sx,a.y,'#ffe66b',26);
      const d=PLANETS[pIdx].arts[a.k];toast={t:3.6,e:d.e,n:d.n,c:d.c};
    }
  }
  if(dist+PX>=LEN){
    const miss=planetMissing(pIdx);
    endInfo={ok:miss===0,miss};state='end';if(miss===0){sWin();const o=pIdx+1;if(o<OUT.length&&!ward.u.includes(o)){ward.u.push(o);ward.sel=o;saveWard();endInfo.newOutfit=OUT[o].n;}}
  }
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,col,al,wt){ctx.font=(wt||'bold')+' '+size+'px system-ui,-apple-system,Segoe UI,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function panel(x,y,w,h,r,col){ctx.fillStyle=col||'rgba(20,10,45,.78)';rr(x,y,w,h,r);ctx.fill();}
function hills(col,base,amp,wl,f){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,base+Math.sin((x+dist*f)/wl)*amp+Math.sin((x+dist*f)/(wl*.37))*amp*.35);ctx.lineTo(W,H);ctx.closePath();ctx.fill();}

const hash=n=>{const q=Math.sin(n*127.1+311.7)*43758.5453;return q-Math.floor(q);};
const mod=(v,m)=>((v%m)+m)%m;
function hx(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function lerpC(a,b,t){const A=hx(a),B=hx(b);return 'rgb('+A.map((v,k)=>Math.round(v+(B[k]-v)*t)).join(',')+')';}
function layer(sp,par,fn){const sc=dist*par;const a=Math.floor(sc/sp)-2;const n=Math.ceil(W/sp)+5;for(let k=a;k<a+n;k++){const h=hash(k*7.13+pIdx*3.1);fn(k*sp+(h-.5)*sp*.6-sc,h,k);}}
function drawBG(pl){
  const prog=Math.min(1,dist/LEN);
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,lerpC(pl.sky[0],pl.sky2[0],prog));g.addColorStop(1,lerpC(pl.sky[1],pl.sky2[1],prog));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=(.15+.65*prog)*(.5+.5*Math.sin(time*2+s.t));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  // moon travels across the sky as the run goes on
  const mx=720-prog*560,my=110-Math.sin(prog*Math.PI)*55;

  ctx.fillStyle='#4b2f7f';rr(-12+l1,-5-(air?0:Math.max(0,Math.cos(rn))*5),14,7,3.5);ctx.fill();rr(-2+l2,-7-(air?0:Math.max(0,-Math.cos(rn))*5),14,7,3.5);ctx.fill();
  // body
  ctx.fillStyle='#6fe3a1';ctx.beginPath();ctx.ellipse(0,-22-bob,14,16,0,0,7);ctx.fill();
  ctx.fillStyle='#b8f5d3';ctx.beginPath();ctx.ellipse(2,-20-bob,8,10,0,0,7);ctx.fill();
  ctx.fillStyle='#ffd24a';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',2,-20-bob);
  // scarf knot
  ctx.fillStyle=OUT[ward.sel].sc;rr(-11,-35-bob,22,8,4);ctx.fill();
  // head
  ctx.fillStyle='#6fe3a1';ctx.beginPath();ctx.ellipse(0,-45-bob,19,16,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,130,170,.55)';ctx.beginPath();ctx.ellipse(-12,-40-bob,4,2.6,0,0,7);ctx.ellipse(13,-40-bob,4,2.6,0,0,7);ctx.fill();
  // eyes
  const blink=(time%3.4)<.12&&!mood;
  for(const ex of[-7,8]){
    if(mood==='happy'){ctx.strokeStyle='#223';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(ex,-44-bob,4.5,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
    else if(mood==='ouch'){ctx.strokeStyle='#223';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(ex-4,-48-bob);ctx.lineTo(ex+4,-41-bob);ctx.moveTo(ex+4,-48-bob);ctx.lineTo(ex-4,-41-bob);ctx.stroke();}
    else{ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,-45-bob,6,blink?.8:8,0,0,7);ctx.fill();
      if(!blink){ctx.fillStyle='#223';ctx.beginPath();ctx.arc(ex+1.6,-44-bob,3.2,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+2.6,-45.6-bob,1.1,0,7);ctx.fill();}}
  }
  // mouth
  ctx.strokeStyle='#2a6a4a';ctx.lineWidth=2;
  if(mood==='happy'){ctx.fillStyle='#35523f';ctx.beginPath();ctx.arc(1,-38-bob,5.5,0,Math.PI);ctx.fill();ctx.fillStyle='#ff8fa8';ctx.beginPath();ctx.ellipse(1,-35.5-bob,3,1.8,0,0,7);ctx.fill();}
  else if(mood==='ouch'){ctx.beginPath();ctx.moveTo(-4,-36-bob);ctx.quadraticCurveTo(0,-40-bob,5,-36-bob);ctx.stroke();}
  else if(air){ctx.fillStyle='#35523f';ctx.beginPath();ctx.ellipse(1,-37-bob,2.8,3.4,0,0,7);ctx.fill();}
  else{ctx.beginPath();ctx.arc(1,-39-bob,4.6,.25,Math.PI-.25);ctx.stroke();}
  const side=ward.sel===1||ward.sel===5,aw=Math.sin(time*5)*3;
  const ant=()=>{const bx=side?15:9,by=side?-52:-60,tx=(side?24:10)+aw*1.5,ty=side?-66:-76;
    ctx.strokeStyle='#4cc488';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by-bob);ctx.quadraticCurveTo(bx+5+aw,(by+ty)/2-bob,tx,ty-bob);ctx.stroke();
    const pu=mood==='happy'?1:.5+.5*Math.sin(time*6);
    ctx.fillStyle='rgba(255,230,107,'+(.2+.25*pu)+')';ctx.beginPath();ctx.arc(tx,ty-bob,8,0,7);ctx.fill();
    ctx.fillStyle='#ffe66b';ctx.beginPath();ctx.arc(tx,ty-bob,4,0,7);ctx.fill();};
  if(side)ant();
  const o=ward.sel;
  if(o===0){
    ctx.fillStyle='#6b4220';ctx.beginPath();ctx.ellipse(-13,-55-bob,7,3,.1,0,7);ctx.ellipse(15,-55-bob,10,3.3,-.1,0,7);ctx.fill();
    ctx.fillStyle='#9a6a38';ctx.beginPath();ctx.ellipse(1,-55-bob,16,10,0,Math.PI,0);ctx.fill();
    ctx.strokeStyle='#6b4220';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-11,-62-bob);ctx.lineTo(-11,-55-bob);ctx.moveTo(-3,-64-bob);ctx.lineTo(-3,-55-bob);ctx.moveTo(5,-64-bob);ctx.lineTo(5,-55-bob);ctx.moveTo(13,-61-bob);ctx.lineTo(13,-55-bob);ctx.stroke();
    ctx.fillStyle='#6b4220';rr(-15,-57-bob,32,4,2);ctx.fill();ctx.beginPath();ctx.arc(1,-65-bob,2.6,0,7);ctx.fill();
  }else if(o===1){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-67-bob,8,0,7);ctx.arc(2,-71-bob,9,0,7);ctx.arc(12,-67-bob,8,0,7);ctx.fill();rr(-14,-67-bob,30,12,3);ctx.fill();
    ctx.fillStyle='#ff8fc7';rr(-14,-58-bob,30,5,2.5);ctx.fill();
  }else if(o===2){
    ctx.fillStyle='#c2354d';ctx.beginPath();ctx.ellipse(1,-54-bob,21,5,0,0,7);ctx.fill();
    ctx.fillStyle='#e8556b';ctx.beginPath();ctx.ellipse(1,-54-bob,20,14,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-9,-61-bob,3,0,7);ctx.arc(3,-64-bob,3.6,0,7);ctx.arc(13,-58-bob,2.6,0,7);ctx.fill();
  }else if(o===3){
    ctx.fillStyle='#5aa8ff';ctx.beginPath();ctx.ellipse(1,-54-bob,16,13,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#2f6fcf';rr(-15,-58-bob,32,7,3.5);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(1,-68-bob,5,0,7);ctx.fill();
  }else if(o===4){
    ctx.fillStyle='#d9a8f0';ctx.beginPath();ctx.ellipse(1,-55-bob,27,5,0,0,7);ctx.fill();
    ctx.fillStyle='#b87fd6';ctx.beginPath();ctx.ellipse(1,-55-bob,13,11,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#7b4a96';rr(-12,-58-bob,26,4,2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(10,-58-bob);ctx.quadraticCurveTo(20,-66-bob,23,-78-bob);ctx.stroke();
  }else{
    ctx.fillStyle='#2a1a6a';ctx.beginPath();ctx.ellipse(1,-54-bob,21,4.5,0,0,7);ctx.fill();
    ctx.fillStyle='#3a2a8a';ctx.beginPath();ctx.moveTo(-13,-55-bob);ctx.quadraticCurveTo(-2,-70-bob,6+aw*.4,-92-bob);ctx.quadraticCurveTo(10,-68-bob,15,-55-bob);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffe66b';ctx.beginPath();ctx.arc(-1,-66-bob,2,0,7);ctx.arc(7,-72-bob,1.6,0,7);ctx.arc(5,-60-bob,1.5,0,7);ctx.fill();
  }
  if(!side)ant();
  // front arm with magnifier
  const ay=air?-34:-24+Math.sin(rn)*4;
  ctx.strokeStyle='#4cc488';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(9,-26-bob);ctx.lineTo(19,ay-bob);ctx.stroke();
  ctx.strokeStyle='#b07a2a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(19,ay-bob);ctx.lineTo(26,ay-8-bob);ctx.stroke();
  ctx.strokeStyle='#ffd24a';ctx.lineWidth=2.5;ctx.fillStyle='rgba(170,235,255,.55)';ctx.beginPath();ctx.arc(30,ay-14-bob,7,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(28,ay-16-bob,2,0,7);ctx.fill();
  ctx.restore();
}
function drawHUD(){
  const hs=Math.max(3,P.hearts);panel(10,10,24+hs*38,36,18);
  for(let i=0;i<hs;i++){ctx.globalAlpha=i<P.hearts?1:.25;txt('❤️',32+i*38,29,20);}
  ctx.globalAlpha=1;
  panel(W/2-110,10,220,36,18);
  txt('✨ '+score+'   · '+PLANETS[pIdx].name+(night?' 🌙':''),W/2,29,15,'#fff');
  panel(W-190,10,180,36,18);
  PLANETS[pIdx].arts.forEach((a,k)=>{ctx.globalAlpha=got[pIdx][k]?1:.3;txt(a.e,W-160+k*52,29,22);});
  ctx.globalAlpha=1;
  const prog=Math.min(1,(dist+PX)/LEN);
  ctx.fillStyle='rgba(20,10,45,.6)';rr(W/2-150,54,300,8,4);ctx.fill();
  ctx.fillStyle='#ffe66b';rr(W/2-150,54,300*prog,8,4);ctx.fill();
  txt('Улики: '+totalGot()+'/'+TOTAL,70,62,13,'#fff','center');
  if(P.magnet>0)txt('🧲 '+Math.ceil(P.magnet)+'с',190,62,13,'#ffd1f0');
  if(P.shield)txt('🛡️',250,62,15);
  txt(musicOn?'🔊':'🔇',W-26,70,18);
  if(toast){
    const a=Math.min(1,toast.t*2);ctx.globalAlpha=a;
    panel(W/2-250,76,500,64,16,'rgba(40,20,80,.9)');
    txt(toast.e,W/2-220,108,30);
    txt('Артефакт: '+toast.n,W/2+10,95,17,'#ffe66b');
    txt(toast.c,W/2+10,119,13,'#fff','center','normal');
    ctx.globalAlpha=1;
  }
  if(time<1e9&&dist<900&&state==='play'){txt('Слева — прыжок (два раза — двойной) · Справа держи — пригнуться',W/2,H-24,14,'rgba(255,255,255,.85)','center','normal');}
}
function drawNight(){
  const g=ctx.createRadialGradient(PX,P.y-30,80,PX,P.y-30,330);g.addColorStop(0,'rgba(5,3,25,0)');g.addColorStop(1,'rgba(5,3,25,.86)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const a of objs.arts){if(a.got)continue;const sx=a.x-dist;if(sx<-60||sx>W+60)continue;const y=a.y+Math.sin(time*3)*6;ctx.fillStyle='rgba(255,240,150,.9)';ctx.beginPath();ctx.arc(sx,y,6+Math.sin(time*5)*1.5,0,7);ctx.fill();}
}
function drawParts(){for(const p of parts){ctx.globalAlpha=Math.max(0,p.l*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();}ctx.globalAlpha=1;}
function overlay(title,lines,sub,col){
  ctx.fillStyle='rgba(10,5,30,.62)';ctx.fillRect(0,0,W,H);
  panel(120,100,560,250,24,'rgba(40,20,80,.94)');
  txt(title,W/2,148,28,col||'#ffe66b');
  lines.forEach((l,i)=>txt(l,W/2,200+i*30,17,'#fff','center','normal'));
  txt(sub,W/2,322,15,'#9fe8ff');
}
function btn(b,label,primary){ctx.fillStyle=primary?'#ffcf4a':'rgba(255,255,255,.18)';rr(b.x,b.y,b.w,b.h,b.h/2);ctx.fill();txt(label,b.x+b.w/2,b.y+b.h/2,20,primary?'#3a2060':'#fff');}

function draw(){
  const pl=PLANETS[pIdx];
  if(state==='menu'){
    pIdx=0;drawBG(PLANETS[0]);
    for(let i=0;i<5;i++){ctx.fillStyle=['#ff9ad5','#3fbf9f','#bfe9ff','#d9a6ee','#8a6bff'][i];ctx.beginPath();ctx.arc(120+i*140,95+Math.sin(time*1.5+i)*8,16+i%2*6,0,7);ctx.fill();}
    txt('Зип: путь домой',W/2,150,46,'#fff');
    txt('Cozy mystery · кто украл звёздный ключ?',W/2,196,18,'#ffe9b0','center','normal');
    txt('Собери все артефакты на пяти планетах — и лети домой',W/2,228,15,'#fff','center','normal');
    const bs=menuBtns();
    if(saved){btn(bs[0],'Продолжить · планета '+(saved.p+1),true);btn(bs[1],'Новая игра',false);}
    else btn(bs[0],'Играть',true);
    if(wonOnce)btn({x:240,y:388,w:320,h:36},'🌙 Ночной режим: '+(night?'ВКЛ':'выкл'),night);
    txt(musicOn?'🔊':'🔇',W-28,28,22);
    dist+=1.5;drawWeather(PLANETS[0]);txt('Наряд: '+OUT[ward.sel].n+' · нажми на Зипа ('+ward.u.length+'/'+OUT.length+')',200,436,13,'#fff','center','normal');drawAlien(W/2-200,GY,false,0,time*6);
    time+=.016;
    return;
  }
  if(state==='win'){
    drawBG(PLANETS[4]);
    const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,300);g.addColorStop(0,'rgba(255,230,120,.4)');g.addColorStop(1,'rgba(255,230,120,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    panel(80,50,640,350,26,'rgba(40,20,80,.94)');
    txt('Тайна раскрыта! 🏡',W/2,100,32,'#ffe66b');
    txt('Это была сова-хранительница. Она спрятала ключ,',W/2,150,17,'#fff','center','normal');
    txt('потому что не хотела, чтобы Зип улетал, не попробовав её пирог.',W/2,178,17,'#fff','center','normal');
    txt('Зип остался на ужин — а потом вернулся домой. Тепло и тихо.',W/2,206,17,'#fff','center','normal');
    let i=0;PLANETS.forEach(p=>p.arts.forEach(a=>{txt(a.e,130+(i%8)*76,260+Math.floor(i/8)*46,30);i++;}));
    txt('Счёт: '+score+' · Все '+TOTAL+' артефактов собраны',W/2,350,17,'#9fe8ff');
    txt('🌙 Открыт ночной режим — включи его в меню',W/2,366,15,'#ffe9b0','center','normal');
    txt('Нажми, чтобы вернуться в меню',W/2,388,14,'#fff','center','normal');
    return;
  }
  drawBG(pl);
  drawPortal();
  for(const o of objs.obs)drawObs(o,pl);
  for(const p of objs.prizes){if(p.got)continue;const sx=p.x-dist;if(sx<-20||sx>W+20)continue;
    if(p.star)txt('⭐',sx,p.y+Math.sin(time*4+p.x)*3,22);
    else{ctx.fillStyle='#ffd1f0';ctx.beginPath();ctx.arc(sx,p.y+Math.sin(time*4+p.x)*3,7,0,7);ctx.fill();ctx.fillStyle='#ff6bb5';ctx.fillRect(sx-2,p.y-3+Math.sin(time*4+p.x)*3,4,6);}}
  for(const a of objs.arts){if(a.got)continue;const sx=a.x-dist;if(sx<-60||sx>W+60)continue;const y=a.y+Math.sin(time*3)*6;
    const g=ctx.createRadialGradient(sx,y,4,sx,y,34);g.addColorStop(0,'rgba(255,240,150,.9)');g.addColorStop(1,'rgba(255,240,150,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,y,34,0,7);ctx.fill();
    txt(PLANETS[pIdx].arts[a.k].e,sx,y,30);}
  for(const b of objs.bon){if(b.got)continue;const sx=b.x-dist;if(sx<-50||sx>W+50)continue;const y=b.y+Math.sin(time*3+b.x)*5;
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(sx,y,22,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.stroke();
    txt(b.t==='magnet'?'🧲':b.t==='shield'?'🛡️':'💖',sx,y,24);}
  drawAlien(PX,P.y,P.duck,P.inv,P.run);
  if(P.shield){ctx.fillStyle='rgba(120,210,255,.2)';ctx.strokeStyle='rgba(170,235,255,.85)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(PX,P.y-34,44+Math.sin(time*6)*2,0,7);ctx.fill();ctx.stroke();}
  if(P.magnet>0){ctx.strokeStyle='rgba(255,150,220,'+(.3+.3*Math.sin(time*8))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(PX,P.y-26,60+Math.sin(time*8)*5,0,7);ctx.stroke();}
  drawWeather(pl);
  drawParts();
  if(night&&state!=='intro')drawNight();
  if(state!=='intro')drawHUD();
  if(state==='intro'){
    ctx.fillStyle='rgba(10,5,30,.55)';ctx.fillRect(0,0,W,H);
    txt('Планета '+(pIdx+1)+' из '+PLANETS.length,W/2,160,18,'#9fe8ff');
    txt(pl.name,W/2,205,44,'#fff');
    const miss=planetMissing(pIdx);
    txt(miss===3?'Найди 3 артефакта и добеги до портала':'Осталось найти артефактов: '+miss,W/2,255,18,'#ffe9b0','center','normal');
    txt('Нажми, чтобы начать',W/2,300,14,'rgba(255,255,255,.7)','center','normal');
  }
  if(state==='dead')overlay('Ой! Сердечки закончились',['Не беда — найденные артефакты остались с тобой.','Попробуем планету ещё раз?'],'Нажми, чтобы повторить');
  if(state==='end'){
    if(endInfo.ok)overlay('Планета пройдена! ✨',['Все артефакты здесь собраны.',endInfo.newOutfit?'Новый наряд для Зипа: «'+endInfo.newOutfit+'»! 🎉':'Портал открывается — летим дальше.'],pIdx+1>=PLANETS.length?'Нажми — лететь домой!':'Нажми — следующая планета','#ffe66b');
    else overlay('Портал закрыт',['Не хватает артефактов: '+endInfo.miss+'.','Они всё ещё лежат на планете — вернись и найди.'],'Нажми, чтобы попробовать снова','#ff9aa8');
  }
}

let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__dbg={get objs(){return objs;},get dist(){return dist;},get state(){return state;},tap:onTap,jump:doJump,get P(){return P;},get got(){return got;},update,draw};
})();
</script>
